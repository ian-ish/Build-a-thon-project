<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Create account · AegisHealth Care</title>
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">🏥</div>
      <div><div class="auth-title">AegisHealth Care</div><div class="auth-sub">Bed &amp; Resource Command</div></div>
    </div>
    <h1>Create your staff account</h1>
    <p class="lead">Step 1 of 2. Next you will verify your identity with a government ID.</p>
    <div id="err" class="form-error" role="alert"></div>
    <form id="regForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="full_name">Full name</label>
        <input class="form-input" id="full_name" autocomplete="name" required>
      </div>
      <div class="auth-row">
        <div class="form-group">
          <label class="form-label" for="email">Work email</label>
          <input class="form-input" id="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Mobile number</label>
          <input class="form-input" id="phone" inputmode="numeric" placeholder="10-digit number" autocomplete="tel" required>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="designation">Designation</label>
        <select class="form-select" id="designation" required>
          <option value="">Select…</option>
          {% for d in designations %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" autocomplete="new-password" required>
        <div class="hint">At least 8 characters, with letters and numbers.</div>
      </div>
      <button class="btn btn-primary" id="submitBtn" type="submit">Continue to ID verification</button>
    </form>
    <div class="auth-foot">Already registered? <a href="/login">Sign in</a></div>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/register.js"></script>
</body>
</html>
