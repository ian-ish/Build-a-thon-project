<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Sign in · AegisHealth Care</title>
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">🏥</div>
      <div><div class="auth-title">AegisHealth Care</div><div class="auth-sub">Bed &amp; Resource Command</div></div>
    </div>
    <h1>Staff sign in</h1>
    <p class="lead">Sign in to continue. Access to the dashboard requires a verified identity (KYC).</p>
    <div id="err" class="form-error" role="alert"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" id="email" type="email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" id="submitBtn" type="submit">Sign in</button>
    </form>
    <div class="auth-foot">New staff member? <a href="/register">Create an account</a></div>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/login.js"></script>
</body>
</html>
